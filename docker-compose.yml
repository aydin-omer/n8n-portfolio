services:
  n8n:
    # Pinned version for a reproducible setup
    image: docker.n8n.io/n8nio/n8n:2.44.6
    container_name: n8n-portfolio
    restart: unless-stopped
    ports:
      - "5679:5678"   # host port 5679 avoids conflicts with other local n8n instances
    env_file:
      - .env
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5679/
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_portfolio_data:/home/node/.n8n   # n8n database and settings (not committed)
      - ./workflows:/home/node/workflows      # exported workflows (committed)

volumes:
  n8n_portfolio_data:
